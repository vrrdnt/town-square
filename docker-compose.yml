services:
  town-square:
    container_name: town-square
    build: .
    environment:
      BOT_TOKEN: "${BOT_TOKEN:?BOT_TOKEN is required}"
      DEV_GUILD_ID: "${DEV_GUILD_ID:-}"
      REGISTER_COMMANDS: "${REGISTER_COMMANDS:-true}"
      SESSION_FILE: "/app/data/sessions.json"
    volumes:
      - town-square-data:/app/data
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('discord.js'); console.log('ok')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  town-square-data:
