services:
  town-square:
    container_name: town-square
    build: .
    environment:
      BOT_TOKEN: ""
      DEV_GUILD_ID: ""
      REGISTER_COMMANDS: "true"
    volumes:
      - town-square-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('discord.js'); console.log('ok')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  town-square-data:
